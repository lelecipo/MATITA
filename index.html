<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matite">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Matite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --surface:#0d0d0d;
  --line:#242424;
  --text:#f2f2f2;
  --dim:#7a7a7a;
  --accent:#d71921;
  --dot:'Doto','Space Mono',ui-monospace,monospace;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 28px);max-width:520px;margin:0 auto;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.brand{font-family:var(--dot);font-weight:800;font-size:15px;letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;position:relative}
.iconbtn svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .badge{position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.iconbtn.warn .badge{display:block}

.tabs{display:flex;gap:6px;margin:6px 0 18px}
.tab{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tab.on{background:var(--text);color:#000;border-color:var(--text)}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav .title{font-family:var(--dot);font-weight:800;font-size:30px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.nav .title small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-top:6px}
.nav .arrows{display:flex;gap:8px}

.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{margin-bottom:8px}
.dow span{text-align:center;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;position:relative;color:var(--text);transition:transform .08s}
.cell:active{transform:scale(.94)}
.cell.empty{border:0;pointer-events:none}
.cell.today::after{content:"";position:absolute;inset:-3px;border:1px solid var(--text);border-radius:15px}
.cell.filled{border-color:transparent;font-weight:700}

.legend{margin:22px 0 0;border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}
.sw{width:14px;height:14px;border-radius:50%;flex:none}
.lrow .nm{flex:1}
.lrow .nm em{display:block;font-style:normal;color:var(--dim);font-size:10px;letter-spacing:.08em;margin-top:3px}
.lrow .ct{font-family:var(--dot);font-weight:800;font-size:26px;min-width:34px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px}
.total span{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.total b{font-family:var(--dot);font-weight:800;font-size:40px;line-height:1}

.mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mrow .mn{width:34px;font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.mrow .bar{flex:1;height:10px;display:flex;gap:2px;border-radius:5px;overflow:hidden;background:#111}
.mrow .bar i{display:block;height:100%}
.mrow .mt{width:28px;text-align:right;font-family:var(--dot);font-weight:800;font-size:20px}
.mrow.zero .mt{color:var(--dim)}
.sec{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:26px 0 4px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .18s;z-index:10}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.on{transform:none}
.sheet h3{margin:0 0 4px;font-family:var(--dot);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.sheet p{margin:0 0 16px;font-size:11px;color:var(--dim);letter-spacing:.06em}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;text-align:left;font-size:13px}
.opt .sw{width:18px;height:18px}
.opt em{display:block;font-style:normal;color:var(--dim);font-size:10px;margin-top:3px;letter-spacing:.06em}
.opt.sel{border-color:var(--text)}
.opt.clear{justify-content:center;color:var(--dim);letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.opt.clear .xs{width:18px;height:18px;border:1px dashed var(--dim);border-radius:50%}
.note{font-size:10px;color:var(--dim);line-height:1.6;margin-top:6px}
</style>
</head>
<body>

<header>
  <div class="brand"><i></i>MATITE</div>
  <button class="iconbtn" id="btnSet" aria-label="Backup">
    <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
    <span class="badge"></span>
  </button>
</header>

<div class="tabs">
  <button class="tab on" data-mode="month">Mese</button>
  <button class="tab" data-mode="year">Anno</button>
</div>

<div class="nav">
  <div class="title" id="title"></div>
  <div class="arrows">
    <button class="iconbtn" id="prev" aria-label="Precedente"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="iconbtn" id="next" aria-label="Successivo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<main id="view"></main>

<div class="overlay" id="ov"></div>
<div class="sheet" id="daySheet"></div>
<div class="sheet" id="setSheet">
  <h3>Backup</h3>
  <p id="lastBackup"></p>
  <button class="opt" id="btnExport"><div>Esporta backup<em>Salva un file con tutti i tuoi allenamenti</em></div></button>
  <button class="opt" id="btnImport"><div>Importa backup<em>Ripristina da un file salvato</em></div></button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <div class="note">Consiglio: esporta una volta al mese e salva il file in iCloud Drive (dal foglio di condivisione scegli "Salva su File").</div>
</div>

<script>
const TYPES=[
  {id:'A',name:'Palestra A',desc:'Petto + Tricipiti',color:'#3b82f6',ink:'#fff'},
  {id:'B',name:'Palestra B',desc:'Schiena + Bicipiti',color:'#ef2b2d',ink:'#fff'},
  {id:'C',name:'Palestra C',desc:'Gambe',color:'#86efac',ink:'#000'},
  {id:'D',name:'Calcio',desc:'',color:'#15803d',ink:'#fff'}
];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MESI3=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const GIORNI=['LUN','MAR','MER','GIO','VEN','SAB','DOM'];
const GIORNI_L=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const byId=Object.fromEntries(TYPES.map(t=>[t.id,t]));

const KEY='training-log-v1', KB='training-log-lastbackup';
let data={}, storageOk=true;
try{
  const raw=localStorage.getItem(KEY)||'{}';
  try{data=JSON.parse(raw)||{}}
  catch(e){
    /* dati illeggibili: conservo una copia di sicurezza prima di ripartire */
    try{localStorage.setItem(KEY+'-corrotto',raw)}catch(_){}
    data={};
  }
}catch(e){storageOk=false}
const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(data));storageOk=true}
  catch(e){storageOk=false;alert('Attenzione: il telefono non permette di salvare i dati. Esporta subito un backup.')}
};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let mode='month';

const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const $=s=>document.querySelector(s);

function counts(prefix){
  const c=Object.fromEntries(TYPES.map(t=>[t.id,0]));let tot=0;
  for(const k in data){ if(k.startsWith(prefix)&&c[data[k]]!==undefined){c[data[k]]++;tot++} }
  return {c,tot};
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===mode));
  const el=$('#title'), v=$('#view');
  if(mode==='month'){
    el.innerHTML=`${MESI[view.m]}<small>${view.y}</small>`;
    v.innerHTML=monthHTML();
  }else{
    el.innerHTML=`${view.y}<small>RIEPILOGO ANNUALE</small>`;
    v.innerHTML=yearHTML();
  }
  updateWarn();
}

function legendHTML(c,tot,label){
  return `<div class="legend">${TYPES.map(t=>`
    <div class="lrow"><span class="sw" style="background:${t.color}"></span>
    <div class="nm">${t.name}${t.desc?`<em>${t.desc}</em>`:''}</div>
    <div class="ct">${c[t.id]}</div></div>`).join('')}</div>
    <div class="total"><span>${label}</span><b>${tot}</b></div>`;
}

function monthHTML(){
  const {y,m}=view;
  const first=(new Date(y,m,1).getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cell empty"></div>';
  const isCur=(y===now.getFullYear()&&m===now.getMonth());
  for(let d=1;d<=dim;d++){
    const k=key(y,m,d), t=byId[data[k]];
    const cls='cell'+(t?' filled':'')+(isCur&&d===now.getDate()?' today':'');
    const st=t?`style="background:${t.color};color:${t.ink}"`:'';
    cells+=`<button class="${cls}" ${st} data-d="${d}">${d}</button>`;
  }
  const {c,tot}=counts(`${y}-${pad(m+1)}-`);
  return `<div class="dow">${GIORNI.map(g=>`<span>${g[0]}</span>`).join('')}</div>
  <div class="grid" id="grid">${cells}</div>
  ${legendHTML(c,tot,'Allenamenti nel mese')}`;
}

function yearHTML(){
  const y=view.y;
  const {c,tot}=counts(`${y}-`);
  let rows='';
  for(let m=0;m<12;m++){
    const r=counts(`${y}-${pad(m+1)}-`);
    const segs=TYPES.map(t=>r.c[t.id]?`<i style="background:${t.color};width:${r.c[t.id]/31*100}%"></i>`:'').join('');
    rows+=`<button class="mrow ${r.tot?'':'zero'}" data-m="${m}"><span class="mn">${MESI3[m]}</span><div class="bar">${segs}</div><span class="mt">${r.tot}</span></button>`;
  }
  return `${legendHTML(c,tot,'Allenamenti nell\'anno')}<div class="sec">Mese per mese</div>${rows}`;
}

/* navigation */
function shift(n){
  if(mode==='month'){
    view.m+=n; if(view.m<0){view.m=11;view.y--} if(view.m>11){view.m=0;view.y++}
  }else view.y+=n;
  render();
}
$('#prev').onclick=()=>shift(-1);
$('#next').onclick=()=>shift(1);
$('#title').onclick=()=>{view={y:now.getFullYear(),m:now.getMonth()};render()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;render()});

/* swipe */
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(sx===null||sheetOpen())return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) shift(dx<0?1:-1);
  sx=null;
},{passive:true});

/* day / month clicks */
$('#view').addEventListener('click',e=>{
  const c=e.target.closest('.cell[data-d]'); if(c){openDay(+c.dataset.d);return}
  const r=e.target.closest('.mrow'); if(r){view.m=+r.dataset.m;mode='month';render()}
});

/* sheets */
const sheetOpen=()=>$('#ov').classList.contains('on');
function openSheet(id){$('#ov').classList.add('on');$('#'+id).classList.add('on')}
function closeSheets(){$('#ov').classList.remove('on');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'))}
$('#ov').onclick=closeSheets;

function openDay(d){
  const {y,m}=view, k=key(y,m,d), cur=data[k];
  const wd=GIORNI_L[new Date(y,m,d).getDay()];
  $('#daySheet').innerHTML=`<h3>${d} ${MESI[m]}</h3><p>${wd.toUpperCase()} ${y}</p>
  ${TYPES.map(t=>`<button class="opt ${cur===t.id?'sel':''}" data-t="${t.id}"><span class="sw" style="background:${t.color}"></span><div>${t.name}${t.desc?`<em>${t.desc}</em>`:''}</div></button>`).join('')}
  <button class="opt clear" data-t=""><span class="xs"></span>Nessun allenamento</button>`;
  $('#daySheet').dataset.k=k;
  openSheet('daySheet');
}
$('#daySheet').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b)return;
  const k=$('#daySheet').dataset.k, t=b.dataset.t;
  if(t) data[k]=t; else delete data[k];
  save(); closeSheets(); render();
  if(navigator.vibrate)navigator.vibrate(8);
});

/* backup */
function updateWarn(){
  const last=+localStorage.getItem(KB)||0;
  const need=Object.keys(data).length>0&&(Date.now()-last>30*864e5);
  $('#btnSet').classList.toggle('warn',need);
}
$('#btnSet').onclick=()=>{
  const last=+localStorage.getItem(KB)||0;
  $('#lastBackup').textContent=last?('ULTIMO BACKUP: '+new Date(last).toLocaleDateString('it-IT')):'NESSUN BACKUP ANCORA';
  openSheet('setSheet');
};
$('#btnExport').onclick=async()=>{
  const payload=JSON.stringify({app:'training-log',version:1,exported:new Date().toISOString(),data},null,1);
  const name=`matite-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([payload],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
    localStorage.setItem(KB,Date.now());
    closeSheets();updateWarn();
  }catch(e){/* annullato */}
};
$('#btnImport').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    const d=(j&&j.data)||j; const clean={};
    for(const k in d){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&byId[d[k]]) clean[k]=d[k] }
    const n=Object.keys(clean).length;
    if(!n){alert('Nessun allenamento valido trovato nel file.')}
    else if(confirm(`Trovati ${n} allenamenti. Sostituire i dati attuali con quelli del file?`)){
      data=clean;save();closeSheets();render();
    }
  }catch(err){alert('File non valido.')}
  e.target.value='';
};

render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
