<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matita">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Matita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --surface:#0d0d0d;
  --line:#242424;
  --text:#f2f2f2;
  --dim:#7a7a7a;
  --accent:#d71921;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --dot:'Doto','Space Mono',ui-monospace,monospace;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overscroll-behavior:none}
/* pagina bloccata: niente scroll né rimbalzo della schermata */
body{position:fixed;inset:0;width:100%;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

#app,#scheda .in,#stats .in{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:var(--sat) 18px calc(var(--sab) + 14px)}
#app{padding-bottom:calc(var(--sab)*.5 + 8px)}

header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;flex:none}
.brand{font-family:var(--dot);font-weight:800;font-size:15px;letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .badge{position:absolute;top:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.iconbtn.warn .badge{display:block}

.tabs{display:flex;gap:6px;margin:4px 0 12px;flex:none}
.tab{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tab.on{background:var(--text);color:#000;border-color:var(--text)}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex:none}
.nav .title{display:flex;align-items:baseline;gap:10px;font-family:var(--dot);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;line-height:1;white-space:nowrap}
.nav .title small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.nav .arrows{display:flex;gap:8px}

/* margine negativo + padding uguale: lascia 4px di spazio ai lati così il contorno del giorno di oggi non viene tagliato (domenica e lunedì), senza spostare nulla */
#view{flex:1;min-height:0;overflow:hidden;margin:0 -4px;padding:0 4px}
#view.scroll{overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}

.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{margin-bottom:6px}
.dow span{text-align:center;font-size:10px;letter-spacing:.14em;color:var(--dim)}
/* altezza fissa per 6 righe: il resto della pagina non si sposta mai tra un mese e l'altro */
.grid{height:clamp(232px,39dvh,320px);grid-template-rows:repeat(6,minmax(0,1fr))}
.cell{border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;position:relative;color:var(--text);transition:transform .08s;min-height:0}
.cell:active{transform:scale(.94)}
.cell.empty{border:0;pointer-events:none}
.cell.today::after{content:"";position:absolute;inset:-3px;border:1px solid var(--text);border-radius:15px}
.cell.filled{border-color:transparent;font-weight:700}
.cell{-webkit-touch-callout:none}
/* giorno "spento": meno visibile ma sempre presente (tienilo premuto per spegnerlo o riaccenderlo) */
.cell.off{color:#555;border:1.5px dashed #3a3a3a;background:transparent}
.cell.off::before{content:'';position:absolute;left:22%;right:22%;top:50%;height:1.5px;background:#3a3a3a}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.lrow{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 12px 9px}
button.lrow{transition:transform .08s}
button.lrow:active{transform:scale(.97)}
.lrow .top{display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.lrow .nm{flex:1;font-size:12px;white-space:nowrap}
.lrow .ct{font-family:var(--dot);font-weight:800;font-size:24px;line-height:1}
.lrow .sub{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.lrow em{display:block;font-style:normal;color:var(--dim);font-size:9.5px;letter-spacing:.04em;white-space:nowrap}
.lrow .go{width:12px;height:12px;stroke:var(--dim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 0}
.total span{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.total b{font-family:var(--dot);font-weight:800;font-size:34px;line-height:1}

.mrow{display:flex;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mrow .mn{width:34px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.mrow .bar{flex:1;height:10px;display:flex;align-items:center}
.mrow .trk{height:10px;display:flex;gap:2px;border-radius:5px;overflow:hidden;background:#111}
.mrow .trk i{display:block;height:100%}
.mrow .mt{width:28px;text-align:right;font-family:var(--dot);font-weight:800;font-size:17px}
.mrow.zero .mt{color:var(--dim)}
.sec{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:22px 0 4px}

/* ---------- scheda allenamento ---------- */
#scheda{display:none;position:fixed;inset:0;z-index:5;background:var(--bg)}
#scheda.on{display:block}
/* fascia in alto del colore dell'attività, fino al bordo dello schermo */
#scheda .in{padding-top:0}
.sbar{display:flex;align-items:center;gap:12px;margin:0 -18px 4px;padding:calc(var(--sat) + 12px) 18px 18px;background:var(--bandc,#222);color:#fff;flex:none}
.sbar .st{flex:1;min-width:0}
.sbar h2{margin:0;font-family:var(--dot);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.sbar .sd{font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.82);text-transform:uppercase;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .iconbtn{border-color:rgba(255,255,255,.55)}
.sbar .iconbtn svg{stroke:#fff}
.slist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.slist.edit{display:flex;flex-direction:column;overflow:hidden;padding-top:12px}
.srow{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.srow:active{background:#0a0a0a}
.srow .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #4a4a4a;flex:none;display:grid;place-items:center;margin-top:-1px;transition:background .12s,border-color .12s}
.srow.done .ck{background:var(--c);border-color:var(--c)}
.srow .tx{transition:opacity .12s}
.srow.done .tx{opacity:.38}
.srow u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.srow .rep{color:var(--dim);margin-left:10px;white-space:nowrap}
.gap{height:22px}
.empty-s{padding:26px 0;font-size:11px;letter-spacing:.1em;color:var(--dim);text-align:center;line-height:1.7}
.sacts{display:flex;gap:8px;padding:22px 0 6px}
.pill{flex:1;padding:12px 0;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center}
.pill.main{background:var(--text);color:#000;border-color:var(--text)}
.hint{font-size:10px;line-height:1.7;color:var(--dim);letter-spacing:.04em;margin:0 0 10px;flex:none}
#editor{flex:1;min-height:0;width:100%;resize:none;outline:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px;font-family:var(--mono);font-size:16px;line-height:1.5;-webkit-user-select:text;user-select:text}
#editor:focus{border-color:#4a4a4a}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .18s;z-index:10}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(var(--sab) + 20px);transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.on{transform:none}
.sheet h3{margin:0 0 4px;font-family:var(--dot);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.sheet p{margin:0 0 16px;font-size:11px;color:var(--dim);letter-spacing:.06em}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;text-align:left;font-size:13px}
.opt .sw{width:18px;height:18px}
.opt em{display:block;font-style:normal;color:var(--dim);font-size:10px;margin-top:3px;letter-spacing:.06em}
.opt.sel{border-color:var(--text)}
.opt.clear{justify-content:center;color:var(--dim);letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.opt.clear .xs{width:18px;height:18px;border:1px dashed var(--dim);border-radius:50%}
.note{font-size:10px;color:var(--dim);line-height:1.6;margin-top:6px}

.hdr2{display:flex;gap:8px;align-items:center}
/* legenda compatta (pagina Anno) */
.legend.cp{margin-top:10px}
.lrow.cp{padding:9px 12px}
.lrow.cp .sub{display:none}
.total.cp{padding-top:10px}
.sech{display:flex;align-items:center;justify-content:space-between;margin:12px 0 2px;flex:none}
.sech .sec{margin:0}
.vsw{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.vsw button{width:40px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--dim)}
.vsw button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.vsw button.on{background:var(--text);color:#000}
.mlist{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.mlist .mrow{flex:1 1 0;min-height:0}
.mgrid{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 12px;align-content:space-between;margin:10px 0 6px}
.mm{display:block;width:100%;text-align:left;align-self:start}
.mm .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mm .hd span{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.mm .hd b{font-family:var(--dot);font-weight:800;font-size:16px}
.mm .d{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mm .d i{aspect-ratio:1/1.15;border-radius:2.5px;background:#151515;display:block}
.mm .d i.x{background:transparent}
.mm .d i.off{background:#070707;outline:1px solid #141414;outline-offset:-1px}
.mm .d i.t{outline:1px solid #f2f2f2;outline-offset:1px}

/* ---------- statistiche ---------- */
#stats{display:none;position:fixed;inset:0;z-index:5;background:var(--bg)}
#stats.on{display:block}
.pgh{display:flex;align-items:center;gap:12px;padding:10px 0 8px;flex:none}
.pgh h2{margin:0;font-family:var(--dot);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.pgh small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.2em;color:var(--dim);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card .l{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.card .v{font-family:var(--dot);font-weight:800;font-size:34px;line-height:1;margin-top:8px}
.card .v small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim);letter-spacing:.06em;margin-left:4px}
.card .s{font-size:10px;color:var(--dim);margin-top:6px;letter-spacing:.04em}
.arow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.arow .nm{width:78px;font-size:11px;white-space:nowrap}
.arow .bar{flex:1;height:8px;background:#111;border-radius:4px;overflow:hidden}
.arow .bar i{display:block;height:100%}
.arow .pc{width:34px;text-align:right;font-size:10px;color:var(--dim)}
.arow .n{width:28px;text-align:right;font-family:var(--dot);font-weight:800;font-size:18px}
.arow .dn{width:34px;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.arow.best .dn{color:var(--text)}
.arow.best .bar i{background:var(--text)!important}
.arow .bar i.w{background:#4a4a4a}
.stbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:12px}

/* ---------- avviso backup ---------- */
#bk{display:none;position:fixed;inset:0;z-index:30;background:var(--accent);color:#fff;flex-direction:column;padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 18px)}
#bk.on{display:flex}
#bk .sp{flex:1}
#bk .big{font-family:var(--dot);font-weight:800;line-height:.9;white-space:nowrap;color:#fff}
#bk .lab{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:16px 0 0 4px;color:rgba(255,255,255,.85)}
#bk .btns{display:flex;flex-direction:column;gap:10px;margin-top:40px}
#bk .pill{padding:16px 0;color:#fff;border-color:rgba(255,255,255,.55)}
#bk .pill.main{background:#fff;color:var(--accent);border-color:#fff}
/* riquadro dipinto in cima: toglie la sfumatura di iOS e dà il colore alla barra di stato (cambia con la schermata) */
#sb{position:fixed;top:0;left:0;right:0;height:11px;pointer-events:none;background:#000;-webkit-background-clip:text;background-clip:text;z-index:100}
/* interruttore di sistema invisibile sopra ogni attività: il tocco vero lo fa scattare e iOS dà il tic */
.opt{position:relative}
.hsw{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:2;-webkit-tap-highlight-color:transparent}
#hap{position:fixed;left:-200px;top:0;width:40px;height:40px;opacity:0;pointer-events:none}

/* iPhone non permette di bloccare la rotazione da un'app web: in orizzontale mostro una schermata nera */
#rot{display:none;position:fixed;inset:0;z-index:50;background:#000;place-items:center;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
@media (orientation:landscape) and (max-height:520px){#rot{display:grid}}
</style>
</head>
<body>
<div id="sb"></div>

<div id="app">
  <header>
    <div class="brand"><i></i>MATITA</div>
    <div class="hdr2">
      <button class="iconbtn" id="btnStats" aria-label="Statistiche"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-7"/></svg></button>
      <button class="iconbtn" id="btnSet" aria-label="Backup">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        <span class="badge"></span>
      </button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-mode="month">Mese</button>
    <button class="tab" data-mode="year">Anno</button>
  </div>

  <div class="nav">
    <div class="title" id="title"></div>
    <div class="arrows">
      <button class="iconbtn" id="prev" aria-label="Precedente"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="iconbtn" id="next" aria-label="Successivo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>

  <main id="view"></main>
</div>

<div id="scheda">
  <div class="in">
    <div class="sbar">
      <button class="iconbtn" id="sBack" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="st"><h2 id="sTitle"></h2><div class="sd" id="sDesc"></div></div>
    </div>
    <div class="slist" id="sList"></div>
  </div>
</div>

<div class="overlay" id="ov"></div>
<div class="sheet" id="daySheet"></div>
<div class="sheet" id="setSheet">
  <h3>Backup</h3>
  <p id="lastBackup"></p>
  <button class="opt" id="btnExport"><div>Esporta backup<em>Salva un file con allenamenti e schede</em></div></button>
  <button class="opt" id="btnImport"><div>Importa backup<em>Ripristina da un file salvato</em></div></button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <div class="note">Consiglio: esporta una volta al mese e salva il file in iCloud Drive (dal foglio di condivisione scegli "Salva su File").</div>
</div>
<div id="stats">
  <div class="in">
    <div class="pgh">
      <button class="iconbtn" id="stBack" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><h2>Statistiche</h2><small id="stSub"></small></div>
    </div>
    <div class="stbody" id="stBody"></div>
  </div>
</div>
<div id="bk">
  <div class="sp"></div>
  <div class="big" id="bkN">0</div>
  <div class="lab" id="bkL">Giorni dall'ultimo backup</div>
  <div class="btns"><button class="pill main" id="bkYes">Backup</button><button class="pill" id="bkLater">Dopo</button></div>
</div>
<div id="rot">Ruota il telefono<br>in verticale</div>

<script>
const TYPES=[
  {id:'A',name:'Palestra A',desc:'Petto + Tricipiti',color:'#3b82f6',ink:'#ffffff'},
  {id:'B',name:'Palestra B',desc:'Schiena + Bicipiti',color:'#ef2b2d',ink:'#ffffff'},
  {id:'C',name:'Palestra C',desc:'Gambe',color:'#1b9247',ink:'#ffffff'},
  {id:'D',name:'Calcio',desc:'',color:'#74c476',ink:'#000000'}
];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MESI3=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const GIORNI=['LUN','MAR','MER','GIO','VEN','SAB','DOM'];
const GIORNI_L=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const byId=Object.fromEntries(TYPES.map(t=>[t.id,t]));

/* ---------- dati: allenamenti (giorni colorati) ---------- */
const KEY='training-log-v1', KB='training-log-lastbackup';
let data={}, storageOk=true;
try{
  const raw=localStorage.getItem(KEY)||'{}';
  try{data=JSON.parse(raw)||{}}
  catch(e){
    /* dati illeggibili: conservo una copia di sicurezza prima di ripartire */
    try{localStorage.setItem(KEY+'-corrotto',raw)}catch(_){}
    data={};
  }
}catch(e){storageOk=false}
const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(data));storageOk=true}
  catch(e){storageOk=false;alert('Attenzione: il telefono non permette di salvare i dati. Esporta subito un backup.')}
};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- dati: schede (elenchi di esercizi con spunte) ---------- */
const SKEY='training-log-schede-v1';
const DEFAULT_LINES={
  A:['Intrarotatori al cavo — 2 × 12–15','Spinte al macchinario — 3 × 8–12','Spinte su panca piana — 3 × 8–12','Croci al macchinario — 2–3 × 10–15','Tricipiti al macchinario — 2–3 × 10–15','Tricipiti al cavo — 2–3 × 10–15','Alzate laterali — 2–3 × 12–15','Alzate frontali — 2 × 12–15','','Addominali — 2–3 serie','Plank — 2 serie'],
  B:['Extrarotatori al cavo — 2 × 12–15','Extrarotatori con manubrio — 2 × 12–15','Dorsali al macchinario — 3 × 8–12','Pulley schiena — 3 × 8–12','(Terzo esercizio schiena) — 2–3 × 10–12','Scrollate Spalle — 3 × 10–12','Bicipiti al macchinario O Manubri — 3 × 10–12','Bicipiti al cavo O panca Scott — 2–3 × 10–15','Pull-up — 23kg','','Addominali — 2–3 serie','Lombari O Hyperextension — 2–3 × 12–15'],
  C:['Leg press — 2–3 × 8–12','Leg extension — 2–3 × 10–15','Leg curl — 2–3 × 10–15','Intro rotatori — 2–3 × 10–15','Calf machine — 2–3 × 12–20','','Stretching']
};
const validSchede=j=>!!j&&['A','B','C'].every(k=>Array.isArray(j[k])&&j[k].every(x=>x&&typeof x.t==='string'&&typeof x.d==='boolean'));
const defaultSchede=()=>Object.fromEntries(Object.keys(DEFAULT_LINES).map(k=>[k,DEFAULT_LINES[k].map(t=>({t,d:false}))]));
function loadSchede(){
  let raw=null;
  try{
    raw=localStorage.getItem(SKEY);
    if(raw){const j=JSON.parse(raw); if(validSchede(j)) return j; throw new Error('formato')}
  }catch(e){
    if(raw){try{localStorage.setItem(SKEY+'-corrotto',raw)}catch(_){}}
  }
  return defaultSchede();
}
let schede=loadSchede();
const saveSchede=()=>{
  try{localStorage.setItem(SKEY,JSON.stringify(schede))}
  catch(e){alert('Attenzione: il telefono non permette di salvare le schede. Esporta subito un backup.')}
};

/* ---------- dati: giorni spenti (riposo, solo visivo) ---------- */
const PKEY='training-log-spenti-v1';
let spenti={};
try{const a=JSON.parse(localStorage.getItem(PKEY)||'[]'); if(Array.isArray(a)) a.forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k))spenti[k]=1})}catch(e){}
const saveSpenti=()=>{try{localStorage.setItem(PKEY,JSON.stringify(Object.keys(spenti).sort()))}catch(e){}};

let now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let mode='month';
const YVKEY='matita-yearview';
let yv='grid';
try{const v=localStorage.getItem(YVKEY); if(v==='bars'||v==='grid')yv=v}catch(e){}

const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function counts(prefix){
  const c=Object.fromEntries(TYPES.map(t=>[t.id,0]));let tot=0;
  for(const k in data){ if(k.startsWith(prefix)&&c[data[k]]!==undefined){c[data[k]]++;tot++} }
  return {c,tot};
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===mode));
  const el=$('#title'), v=$('#view');
  v.classList.toggle('scroll',mode==='year');
  if(mode==='month'){
    el.innerHTML=`${MESI[view.m]}<small>${view.y}</small>`;
    v.innerHTML=monthHTML();
  }else{
    el.innerHTML=`${view.y}<small>Riepilogo</small>`;
    v.innerHTML=yearHTML();
    v.scrollTop=0;
    /* pagina fissa; scorre solo se su uno schermo molto piccolo non ci sta */
    v.style.overflowY=(v.scrollHeight>v.clientHeight+2)?'auto':'hidden';
  }
  updateWarn();
}

const ARROW='<svg class="go" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>';
function legendHTML(c,tot,label,cp){
  return `<div class="legend${cp?' cp':''}">${TYPES.map(t=>{
    const inner=`<div class="top"><span class="sw" style="background:${t.color}"></span><span class="nm">${t.name}</span><span class="ct">${c[t.id]}</span></div>
      <div class="sub"><em>${t.desc||'&nbsp;'}</em>${t.id!=='D'?ARROW:''}</div>`;
    return t.id!=='D'?`<button class="lrow${cp?' cp':''}" data-s="${t.id}">${inner}</button>`:`<div class="lrow${cp?' cp':''}">${inner}</div>`;
  }).join('')}</div>
    <div class="total${cp?' cp':''}"><span>${label}</span><b>${tot}</b></div>`;
}

function monthHTML(){
  const {y,m}=view;
  const first=(new Date(y,m,1).getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cell empty"></div>';
  const isCur=(y===now.getFullYear()&&m===now.getMonth());
  for(let d=1;d<=dim;d++){
    const k=key(y,m,d), t=byId[data[k]];
    const cls='cell'+(t?' filled':'')+(!t&&spenti[k]?' off':'')+(isCur&&d===now.getDate()?' today':'');
    const st=t?`style="background:${t.color};color:${t.ink}"`:'';
    cells+=`<button class="${cls}" ${st} data-d="${d}">${d}</button>`;
  }
  const {c,tot}=counts(`${y}-${pad(m+1)}-`);
  return `<div class="dow">${GIORNI.map(g=>`<span>${g[0]}</span>`).join('')}</div>
  <div class="grid" id="grid">${cells}</div>
  ${legendHTML(c,tot,'Allenamenti nel mese')}`;
}

function yearHTML(){
  const y=view.y;
  const {c,tot}=counts(`${y}-`);
  const IB='<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h7"/></svg>';
  const IG='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="4.5" height="4.5" rx="1"/><rect x="9.8" y="4" width="4.5" height="4.5" rx="1"/><rect x="15.5" y="4" width="4.5" height="4.5" rx="1"/><rect x="4" y="9.8" width="4.5" height="4.5" rx="1"/><rect x="9.8" y="9.8" width="4.5" height="4.5" rx="1"/><rect x="15.5" y="9.8" width="4.5" height="4.5" rx="1"/><rect x="4" y="15.5" width="4.5" height="4.5" rx="1"/><rect x="9.8" y="15.5" width="4.5" height="4.5" rx="1"/><rect x="15.5" y="15.5" width="4.5" height="4.5" rx="1"/></svg>';
  const sw=`<div class="sech"><div class="sec">Mese per mese</div><div class="vsw"><button data-v="bars" aria-label="Barre" class="${yv==='bars'?'on':''}">${IB}</button><button data-v="grid" aria-label="Griglia" class="${yv==='grid'?'on':''}">${IG}</button></div></div>`;
  let body='';
  if(yv==='bars'){
    let rows='';
    for(let m=0;m<12;m++){
      const r=counts(`${y}-${pad(m+1)}-`);
      const nOff=Object.keys(spenti).filter(k=>k.startsWith(`${y}-${pad(m+1)}-`)&&!data[k]).length;
      const avail=Math.max(1,31-nOff);          /* i giorni spenti accorciano la barra */
      const segs=TYPES.map(t=>r.c[t.id]?`<i style="background:${t.color};width:${r.c[t.id]/avail*100}%"></i>`:'').join('');
      rows+=`<button class="mrow ${r.tot?'':'zero'}" data-m="${m}"><span class="mn">${MESI3[m]}</span><div class="bar"><div class="trk" style="width:${avail/31*100}%">${segs}</div></div><span class="mt">${r.tot}</span></button>`;
    }
    body=`<div class="mlist">${rows}</div>`;
  }else{
    const todayK=key(now.getFullYear(),now.getMonth(),now.getDate());
    let ms='';
    for(let m=0;m<12;m++){
      const first=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
      let cells='<i class="x"></i>'.repeat(first);
      for(let d=1;d<=dim;d++){
        const k=key(y,m,d), t=byId[data[k]];
        cells+=`<i class="${!t&&spenti[k]?'off':''}${k===todayK?' t':''}"${t?` style="background:${t.color}"`:''}></i>`;
      }
      const r=counts(`${y}-${pad(m+1)}-`);
      ms+=`<button class="mm" data-m="${m}"><div class="hd"><span>${MESI3[m]}</span><b>${r.tot}</b></div><div class="d">${cells}</div></button>`;
    }
    body=`<div class="mgrid">${ms}</div>`;
  }
  return `${legendHTML(c,tot,'Allenamenti nell\'anno',true)}${sw}${body}`;
}

/* navigation */
function shift(n){
  if(mode==='month'){
    view.m+=n; if(view.m<0){view.m=11;view.y--} if(view.m>11){view.m=0;view.y++}
  }else view.y+=n;
  render();
}
$('#prev').onclick=()=>shift(-1);
$('#next').onclick=()=>shift(1);
$('#title').onclick=()=>{view={y:now.getFullYear(),m:now.getMonth()};render()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;render()});

/* swipe */
const schedaOpen=()=>$('#scheda').classList.contains('on');
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(sx===null||sheetOpen()||schedaOpen()||$('#stats').classList.contains('on')||$('#bk').classList.contains('on'))return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) shift(dx<0?1:-1);
  sx=null;
},{passive:true});

/* day / month / scheda clicks */
/* pressione lunga su un giorno senza allenamento: lo spegne (o lo riaccende) */
let lpT=null,lpX=0,lpY=0,lpFired=0;
const lpCancel=()=>{clearTimeout(lpT);lpT=null};
$('#view').addEventListener('pointerdown',e=>{
  const c=e.target.closest('.cell[data-d]'); if(!c)return;
  lpX=e.clientX;lpY=e.clientY; lpCancel();
  lpT=setTimeout(()=>{
    lpT=null;
    const k=key(view.y,view.m,+c.dataset.d);
    if(data[k])return;                       /* i giorni con un allenamento non si spengono */
    if(spenti[k])delete spenti[k]; else spenti[k]=1;
    saveSpenti(); lpFired=Date.now(); render();
  },480);
});
$('#view').addEventListener('pointermove',e=>{if(lpT&&Math.hypot(e.clientX-lpX,e.clientY-lpY)>10)lpCancel()});
['pointerup','pointercancel','pointerleave'].forEach(n=>$('#view').addEventListener(n,lpCancel));
$('#view').addEventListener('contextmenu',e=>e.preventDefault());

$('#view').addEventListener('click',e=>{
  if(Date.now()-lpFired<800)return;           /* il rilascio dopo una pressione lunga non apre il foglio */
  const s=e.target.closest('.lrow[data-s]'); if(s){openScheda(s.dataset.s);return}
  const c=e.target.closest('.cell[data-d]'); if(c){openDay(+c.dataset.d);return}
  const vb=e.target.closest('[data-v]'); if(vb){yv=vb.dataset.v;try{localStorage.setItem(YVKEY,yv)}catch(_){}render();return}
  const r=e.target.closest('.mrow,.mm'); if(r){view.m=+r.dataset.m;mode='month';render()}
});

/* tic al tocco: iPhone non ha la vibrazione web, ma un interruttore di sistema nascosto dà un colpetto (iOS 17.4+) */
function haptic(){
  /* Android: vibrazione normale. Su iPhone (iOS 26.5+) il tic parte solo dal tocco reale su un interruttore invisibile: vedi .hsw */
  try{ if(navigator.vibrate)navigator.vibrate(10) }catch(e){}
}

/* colore della barra di stato (e del riquadro dipinto in cima) */
function setBar(c){
  const e=document.getElementById('sb'); if(e)e.style.background=c;
  const m=document.querySelector('meta[name="theme-color"]'); if(m)m.setAttribute('content',c);
}

/* sheets */
const sheetOpen=()=>$('#ov').classList.contains('on');
function openSheet(id){$('#ov').classList.add('on');$('#'+id).classList.add('on')}
function closeSheets(){$('#ov').classList.remove('on');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'))}
$('#ov').onclick=closeSheets;

$('#daySheet').addEventListener('click',e=>{

/* ---------- scheda: apertura, spunte, azzera, modifica ---------- */
let curS=null, editing=false;
function lineHTML(t){
  const m=t.match(/^(.*?)\s+(?:—|–|-)\s+(.*)$/);
  return m?`<u>${esc(m[1])}</u><span class="rep">${esc(m[2])}</span>`:`<u>${esc(t)}</u>`;
}
function parseLines(txt){
  const L=txt.replace(/\r/g,'').split('\n').map(s=>s.replace(/^\s*(?:[-*•]\s+)?(?:\[[ xX]?\]\s*)?/,'').trim());
  const out=[];
  for(const l of L){ if(l===''&&(out.length===0||out[out.length-1]===''))continue; out.push(l) }
  while(out.length&&out[out.length-1]==='')out.pop();
  return out;
}
function openScheda(id){curS=id;editing=false;renderScheda();$('#scheda').classList.add('on');$('#sList').scrollTop=0;setBar(byId[id].color)}
function closeScheda(){$('#scheda').classList.remove('on');curS=null;editing=false;setBar('#000000');render()}
function renderScheda(){
  if(!curS)return;
  const t=byId[curS], items=schede[curS], list=$('#sList');
  const real=items.filter(x=>x.t.trim());
  $('#sTitle').textContent=t.name;
  $('#sDesc').textContent=t.desc;
  $('#scheda').style.setProperty('--bandc',t.color);
  const top=list.scrollTop;
  list.classList.toggle('edit',editing);
  if(editing){
    list.innerHTML=`<p class="hint">Una riga per esercizio, nel formato «Nome — serie × ripetizioni». Il nome viene sottolineato. Una riga vuota crea uno spazio. Puoi incollare un elenco copiato da Note. Per spostare un esercizio, taglialo e incollalo dove vuoi.</p>
      <textarea id="editor" spellcheck="false" autocapitalize="sentences"></textarea>
      <div class="sacts"><button class="pill" data-a="cancel">Annulla</button><button class="pill main" data-a="save">Salva</button></div>`;
    $('#editor').value=items.map(x=>x.t).join('\n');
  }else{
    const rows=items.map((x,i)=>x.t.trim()
      ?`<button class="srow ${x.d?'done':''}" data-i="${i}"><span class="ck" style="--c:${t.color}"></span><span class="tx">${lineHTML(x.t)}</span></button>`
      :'<div class="gap"></div>').join('');
    list.innerHTML=(real.length?rows:'<div class="empty-s">Nessun esercizio.<br>Tocca «Matita» per aggiungerne.</div>')
      +`<div class="sacts"><button class="pill" data-a="edit">Matita</button><button class="pill main" data-a="reset">Gomma</button></div>`;
    list.scrollTop=top;
  }
}
$('#sBack').onclick=closeScheda;
$('#sList').addEventListener('click',e=>{
  const row=e.target.closest('.srow');
  if(row){const it=schede[curS][+row.dataset.i]; it.d=!it.d; saveSchede(); renderScheda(); return}
  const b=e.target.closest('[data-a]'); if(!b)return;
  const a=b.dataset.a;
  if(a==='reset'){schede[curS].forEach(x=>x.d=false);saveSchede();renderScheda()}
  else if(a==='edit'){editing=true;renderScheda();$('#editor').focus()}
  else if(a==='cancel'){editing=false;renderScheda()}
  else if(a==='save'){
    const old={}; schede[curS].forEach(x=>{(old[x.t]=old[x.t]||[]).push(x.d)});
    schede[curS]=parseLines($('#editor').value).map(t=>{const arr=old[t];return {t,d:t&&arr&&arr.length?arr.shift():false}});
    saveSchede(); editing=false; renderScheda();
  }
});

/* ---------- backup ---------- */
function updateWarn(){
  const last=+localStorage.getItem(KB)||0;
  const need=Object.keys(data).length>0&&(Date.now()-last>30*864e5);
  $('#btnSet').classList.toggle('warn',need);
}
$('#btnSet').onclick=()=>{
  const last=+localStorage.getItem(KB)||0;
  $('#lastBackup').textContent=last?('ULTIMO BACKUP: '+new Date(last).toLocaleDateString('it-IT')):'NESSUN BACKUP ANCORA';
  openSheet('setSheet');
};
async function doExport(){
  const payload=JSON.stringify({app:'training-log',version:3,exported:new Date().toISOString(),data,schede,spenti:Object.keys(spenti).sort()},null,1);
  const name=`matita-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([payload],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
    localStorage.setItem(KB,Date.now());
    return true;
  }catch(e){return false}   /* annullato */
}
$('#btnExport').onclick=async()=>{ if(await doExport()){closeSheets();updateWarn()} };

/* ---------- avviso backup (dopo 30 giorni; "Dopo" lo rimanda di 3 giorni) ---------- */
const BSN='matita-backup-rimanda';
function bkDays(){
  const last=+localStorage.getItem(KB)||0;
  let ref=last;
  if(!ref){const ks=Object.keys(data).filter(k=>byId[data[k]]).sort(); if(!ks.length)return null; const [y,m,d]=ks[0].split('-').map(Number); ref=new Date(y,m-1,d).getTime()}
  return {n:Math.floor((Date.now()-ref)/864e5),never:!last};
}
function fitBk(){
  const b=$('#bkN'), box=$('#bk'); if(!box.classList.contains('on'))return;
  const w=box.clientWidth-48, p=document.createElement('span');
  p.textContent=b.textContent; p.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font-family:var(--dot);font-weight:800;font-size:100px';
  document.body.appendChild(p); const pw=p.offsetWidth||1; p.remove();
  b.style.fontSize=Math.min(100*w/pw, box.clientHeight*0.5)+'px';
}
function maybeBackupScreen(){
  try{
    if($('#bk').classList.contains('on'))return;
    if(!Object.keys(data).length)return;
    const r=bkDays(); if(!r||r.n<30)return;
    if(Date.now()<(+localStorage.getItem(BSN)||0))return;
    $('#bkN').textContent=r.n;
    $('#bkL').textContent=r.never?'Giorni senza backup':'Giorni dall\'ultimo backup';
    $('#bk').classList.add('on'); setBar('#d71921'); fitBk();
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBk);
  }catch(e){}
}
$('#bkLater').onclick=()=>{try{localStorage.setItem(BSN,Date.now()+3*864e5)}catch(e){} $('#bk').classList.remove('on');setBar('#000000')};
$('#bkYes').onclick=async()=>{ if(await doExport()){$('#bk').classList.remove('on');setBar('#000000');updateWarn()} };
window.addEventListener('resize',fitBk);

/* ---------- statistiche ---------- */
function statsHTML(){
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const todayK=key(today.getFullYear(),today.getMonth(),today.getDate());
  const ks=Object.keys(data).filter(k=>byId[data[k]]&&k<=todayK).sort();
  if(!ks.length){$('#stSub').textContent='';return '<div class="empty-s">Nessun allenamento ancora.<br>Le statistiche compaiono dopo il primo.</div>'}
  const P=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
  const first=P(ks[0]);
  $('#stSub').textContent=`DAL ${first.getDate()} ${MESI3[first.getMonth()]} ${first.getFullYear()}`;
  const span=Math.round((today-first)/864e5)+1;
  const avg=(ks.length/Math.max(1,span/7)).toFixed(1).replace('.',',');
  let offN=0; for(const k in spenti){ if(!data[k]&&k>=ks[0]&&k<=todayK) offN++ }
  const denom=span-offN, act=denom>0?Math.round(ks.length/denom*100):0;
  /* mese e settimana migliori (a parità vince il più recente) */
  const mc={}, wc={}, wd=[0,0,0,0,0,0,0], tc=Object.fromEntries(TYPES.map(t=>[t.id,0]));
  for(const k of ks){
    mc[k.slice(0,7)]=(mc[k.slice(0,7)]||0)+1;
    const d=P(k), dow=(d.getDay()+6)%7, mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow);
    const wk=key(mon.getFullYear(),mon.getMonth(),mon.getDate()); wc[wk]=(wc[wk]||0)+1;
    wd[dow]++; tc[data[k]]++;
  }
  let bm=null,bmn=0; Object.keys(mc).sort().forEach(k=>{if(mc[k]>=bmn){bm=k;bmn=mc[k]}});
  let bw=null,bwn=0; Object.keys(wc).sort().forEach(k=>{if(wc[k]>=bwn){bw=k;bwn=wc[k]}});
  const [by,bmo]=bm.split('-').map(Number);
  const w0=P(bw), w1=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+6);
  const f=d=>`${d.getDate()} ${MESI3[d.getMonth()]}`;
  const tot=ks.length, tmax=Math.max(...TYPES.map(t=>tc[t.id])), wmax=Math.max(...wd);
  return `<div class="sec" style="margin-top:10px">Costanza</div>
  <div class="two"><div class="card"><div class="l">Media a settimana</div><div class="v">${avg}<small>/ sett.</small></div><div class="s">dall'inizio</div></div>
  <div class="card"><div class="l">Giorni attivi</div><div class="v">${act}<small>%</small></div><div class="s">sui giorni non spenti</div></div></div>
  <div class="sec">Record</div>
  <div class="two"><div class="card"><div class="l">Mese migliore</div><div class="v">${MESI3[bmo-1]}<small>${bmn}</small></div><div class="s">${by}</div></div>
  <div class="card"><div class="l">Settimana migliore</div><div class="v">${bwn}<small>allen.</small></div><div class="s">${f(w0)} – ${f(w1)}</div></div></div>
  <div class="sec">Per attività</div>
  ${TYPES.map(t=>`<div class="arow"><span class="sw" style="background:${t.color}"></span><span class="nm">${t.name}</span><div class="bar"><i style="background:${t.color};width:${tmax?tc[t.id]/tmax*100:0}%"></i></div><span class="pc">${Math.round(tc[t.id]/tot*100)}%</span><span class="n">${tc[t.id]}</span></div>`).join('')}
  <div class="sec">Giorno della settimana</div>
  ${GIORNI.map((g,i)=>`<div class="arow ${wd[i]===wmax&&wmax>0?'best':''}"><span class="dn">${g}</span><div class="bar"><i class="w" style="width:${wmax?wd[i]/wmax*100:0}%"></i></div><span class="n">${wd[i]}</span></div>`).join('')}`;
}
$('#btnStats').onclick=()=>{$('#stBody').innerHTML=statsHTML();$('#stBody').scrollTop=0;$('#stats').classList.add('on')};
$('#stBack').onclick=()=>$('#stats').classList.remove('on');
$('#btnImport').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    const d=(j&&j.data)||j; const clean={};
    for(const k in d){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&byId[d[k]]) clean[k]=d[k] }
    const n=Object.keys(clean).length;
    const sch=(j&&validSchede(j.schede))?j.schede:null;   /* i backup vecchi non hanno le schede: in quel caso restano quelle attuali */
    if(!n&&!sch){alert('Nessun allenamento valido trovato nel file.')}
    else if(confirm(`Trovati ${n} allenamenti${sch?' e le schede':''}. Sostituire i dati attuali con quelli del file?`)){
      data=clean;save();
      if(sch){schede=sch;saveSchede()}
      if(Array.isArray(j&&j.spenti)){spenti={};j.spenti.forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k))spenti[k]=1})}   /* i backup vecchi non li hanno: restano quelli attuali */
      for(const k in spenti) if(data[k]) delete spenti[k];
      saveSpenti();
      if(j&&j.exported){const t=Date.parse(j.exported); if(t){try{localStorage.setItem(KB,t)}catch(_){}}}
      closeSheets();render();
    }
  }catch(err){alert('File non valido.')}
  e.target.value='';
};

/* se l'app resta aperta o torna in primo piano dopo mezzanotte, aggiorna "oggi" */
function refreshNow(){now=new Date();render();maybeBackupScreen()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshNow()});
function armMidnight(){const n=new Date();const ms=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,2)-n;setTimeout(()=>{refreshNow();armMidnight()},ms)}
armMidnight();

render();
maybeBackupScreen();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
